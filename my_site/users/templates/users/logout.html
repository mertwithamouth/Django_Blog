{% extends "base.html" %}
{% load static %}

{%  block css_style %}
        <link rel="stylesheet" href="{% static 'users/logout.css' %}">
{%  endblock %}

{% block title %}Logout{% endblock title %}
{% block content %}
    <section id="logout-card">
            <div class="card-body">
                <h1 class="card-title">You have been logged out</h1>

                </div>
            </div>

    <div class="card-control">
        <a href="{% url 'login' %}" class="sign-in-button">Sign in again</a>
    </div>

     </section>


{% endblock content %}
