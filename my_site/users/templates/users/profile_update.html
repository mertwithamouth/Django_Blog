{% extends 'base.html' %}
{% load static %}

{%  block css_style %}
        <link rel="stylesheet" href="{% static 'users/profile_update.css' %}">
{%  endblock %}

{% block content %}

<form method="post" enctype="multipart/form-data" action="{% url 'users-profile-update' %}">
    {% csrf_token %}
    <div class="form-group">
        <h4>Update User Info</h4>
        {{ user_form.as_p }}
    </div>
    <div class="form-group">
        <h4>Update Profile Info</h4>
        {{ profile_form.as_p }}
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
