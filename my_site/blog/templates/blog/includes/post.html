<article class="post">
        <a href='{% url "post_detail" post_id=post.id  %}'>
            <img src="{{ post.image.url }}">
                <div class="post_content">
                    <h3> {{ post.title }}</h3>
                        <p>
                        {{ post.excerpt }}
                        </p>

                </div>
            </img>
        </a>
        <p>
            {{post.author}}
        </p>
</article>
